kind = "mobile"
previewPath = "/"
title = "EchoSafe"
version = "1.0.0"
id = "artifacts/echosafe"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22125

[services.development]
run = "pnpm --filter @workspace/echosafe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/echosafe", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/echosafe", "run", "serve" ]

[services.env]
PORT = "22125"
BASE_PATH = "/"
